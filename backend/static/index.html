<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RipRobot2 Control Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Sanfter Übergang für den Ladebalken */
        #progress-bar { transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 font-sans antialiased min-h-screen">
    
    <div class="max-w-4xl mx-auto p-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">RipRobot<span class="text-blue-500">2</span></h1>
                <p class="text-sm text-gray-400 mt-1">Headless CD Ripping Station</p>
            </div>
            <div class="flex space-x-2 bg-gray-900 p-1 rounded-lg border border-gray-800">
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="px-4 py-2 rounded-md bg-gray-800 text-white font-medium shadow-sm transition">Dashboard</button>
                <button onclick="switchTab('settings')" id="btn-settings" class="px-4 py-2 rounded-md text-gray-400 hover:text-white font-medium transition">Einstellungen</button>
            </div>
        </header>

        <!-- DASHBOARD TAB -->
        <div id="tab-dashboard" class="block space-y-6">
            
            <!-- Status Card -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-300">Aktueller Status</h2>
                        <div class="mt-2 flex items-center space-x-3">
                            <span id="status-indicator" class="relative flex h-4 w-4">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-gray-500 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-4 w-4 bg-gray-500"></span>
                            </span>
                            <span id="status-text" class="text-2xl font-bold text-white">Warte auf System...</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-gray-500 uppercase tracking-wider font-semibold">Erkanntes Medium</p>
                        <p id="track-artist" class="text-lg font-medium text-gray-200 mt-1">-</p>
                        <p id="track-album" class="text-md text-gray-400">-</p>
                    </div>
                </div>

                <!-- Progress Bar -->
                <div class="mt-8">
                    <div class="flex justify-between text-sm mb-2">
                        <span class="text-gray-400 font-medium" id="progress-label">Fortschritt</span>
                        <span class="text-white font-bold" id="progress-percent">0%</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-4 overflow-hidden border border-gray-700">
                        <div id="progress-bar" class="bg-blue-500 h-4 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end">
                <button onclick="triggerRip()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-6 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Manuellen Rip erzwingen</span>
                </button>
            </div>
        </div>

        <!-- SETTINGS TAB -->
        <div id="tab-settings" class="hidden">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
                <h2 class="text-xl font-bold text-white mb-6">System-Einstellungen</h2>
                
                <form id="settings-form" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Format -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">Ausgabeformat</label>
                            <select id="set-format" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition">
                                <option value="FLAC">FLAC (Verlustfrei, Getaggt)</option>
                                <option value="MP3">MP3 (V0 Qualität, Getaggt)</option>
                                <option value="WAV">WAV (Rohdaten, Keine Tags)</option>
                            </select>
                        </div>
                        
                        <!-- Zielordner -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">Zielverzeichnis (USB-Stick)</label>
                            <input type="text" id="set-path" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" placeholder="/media/usb">
                        </div>

                        <!-- Paranoia Mode -->
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-2">Auslese-Genauigkeit</label>
                            <select id="set-paranoia" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition">
                                <option value="safe">Sicher (Standard, Kratzer-Korrektur aktiv)</option>
                                <option value="fast">Schnell (Weniger Überprüfung)</option>
                                <option value="disable">Ausgeschaltet (Ignoriert alle Fehler)</option>
                            </select>
                        </div>

                        <!-- Timeouts -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-2">MusicBrainz Timeout (Sek)</label>
                                <input type="number" id="set-net-timeout" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-2">Rip-Abbruch nach (Sek)</label>
                                <input type="number" id="set-rip-timeout" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition">
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-800 flex justify-between items-center">
                        <span id="save-msg" class="text-green-400 text-sm font-medium opacity-0 transition-opacity">Einstellungen gespeichert!</span>
                        <button type="button" onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-medium transition shadow-lg shadow-blue-500/20">
                            Speichern
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
    </div>

    <script>
        // --- Tab Navigation ---
        function switchTab(tab) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-settings').classList.add('hidden');
            
            document.getElementById('btn-dashboard').className = "px-4 py-2 rounded-md text-gray-400 hover:text-white font-medium transition";
            document.getElementById('btn-settings').className = "px-4 py-2 rounded-md text-gray-400 hover:text-white font-medium transition";
            
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).className = "px-4 py-2 rounded-md bg-gray-800 text-white font-medium shadow-sm transition";
            
            if(tab === 'settings') loadSettings();
        }

        // --- Status Polling ---
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                document.getElementById('status-text').innerText = data.message;
                document.getElementById('track-artist').innerText = data.artist || "-";
                document.getElementById('track-album').innerText = data.album || "-";
                
                const bar = document.getElementById('progress-bar');
                const percentText = document.getElementById('progress-percent');
                bar.style.width = `${data.progress}%`;
                percentText.innerText = `${data.progress}%`;

                // Farben basierend auf Status anpassen
                const indicatorInner = document.querySelector('#status-indicator span:nth-child(2)');
                const indicatorPing = document.querySelector('#status-indicator span:nth-child(1)');
                
                let colorClass = 'bg-gray-500'; // idle
                if (data.state === 'metadata') colorClass = 'bg-yellow-500';
                if (data.state === 'ripping') colorClass = 'bg-blue-500';
                if (data.state === 'converting') colorClass = 'bg-purple-500';
                if (data.state === 'success') colorClass = 'bg-green-500';
                if (data.state === 'error') colorClass = 'bg-red-500';

                // Alle alten Farben entfernen und neue setzen
                indicatorInner.className = `relative inline-flex rounded-full h-4 w-4 ${colorClass}`;
                indicatorPing.className = `animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${colorClass}`;
                
                // Bei idle/success das Blinken (ping) ausschalten
                if (data.state === 'idle' || data.state === 'success') {
                    indicatorPing.style.display = 'none';
                } else {
                    indicatorPing.style.display = 'block';
                }
                
                bar.className = `h-4 rounded-full ${colorClass.replace('bg-', 'bg-')}`;

            } catch (e) {
                console.error("Kann Backend nicht erreichen.");
            }
        }

        // --- Settings Logik ---
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                document.getElementById('set-format').value = data.format;
                document.getElementById('set-path').value = data.output_path;
                document.getElementById('set-paranoia').value = data.paranoia_mode;
                document.getElementById('set-net-timeout').value = data.network_timeout;
                document.getElementById('set-rip-timeout').value = data.rip_timeout;
            } catch (e) {
                console.error("Fehler beim Laden der Einstellungen.");
            }
        }

        async function saveSettings() {
            const settings = {
                format: document.getElementById('set-format').value,
                output_path: document.getElementById('set-path').value,
                paranoia_mode: document.getElementById('set-paranoia').value,
                network_timeout: parseInt(document.getElementById('set-net-timeout').value),
                rip_timeout: parseInt(document.getElementById('set-rip-timeout').value)
            };

            try {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                
                // Erfolgsmeldung einblenden und ausblenden
                const msg = document.getElementById('save-msg');
                msg.classList.remove('opacity-0');
                setTimeout(() => msg.classList.add('opacity-0'), 3000);
            } catch (e) {
                alert("Fehler beim Speichern!");
            }
        }
        
        async function triggerRip() {
            try {
                await fetch('/trigger-rip?device=sr0', { method: 'POST' });
            } catch (e) {
                console.error("Konnte Rip nicht starten.");
            }
        }

        // Start: Status jede Sekunde abrufen
        setInterval(fetchStatus, 1000);
        fetchStatus();
    </script>
</body>
</html>
