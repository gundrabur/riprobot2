services:
  riprobot-backend:
    build: 
      context: ./backend
    container_name: riprobot_core
    privileged: true             # NEU: Erlaubt dynamische Hardware-Erkennung (ersetzt devices)
    restart: unless-stopped
    ports:
      - "8000:8000"              # Port für das FastAPI Web-Interface
    volumes:
      - ./backend:/app
      - /media:/media:rshared
      - /dev:/dev                # NEU: Macht alle USB/CD-Geräte (auch nachträglich) sichtbar
    dns:
      - 1.1.1.1                  # Fallback-DNS, falls der Docker-eigene Resolver/Router-DNS ausfällt
      - 8.8.8.8
    environment:
      - TZ=Europe/Berlin
      - PYTHONUNBUFFERED=1